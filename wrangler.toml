name = "myvideoto-api"
main = "worker/src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Cobalt backend (Facebook / TikTok / Instagram)
COBALT_API_URL = "https://cobalt-api-ogz5.onrender.com"
# yt-dlp backend (YouTube) — UPDATE after deploying yt-api to Render
YT_BACKEND_URL = "https://myvideoto-yt-api.onrender.com"
# Browser origins allowed to call this worker (production, previews, local dev)
ALLOWED_ORIGINS = "https://myvideoto.pages.dev,http://localhost:5173,http://127.0.0.1:5173"
RATE_LIMIT_PER_MIN = "15"
